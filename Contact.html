    <h2 class="mt-3">Contact Us</h2>

    <p>If you have any questions, suggestions, or feedback, feel free to contact us.</p>

    <form>

        <div class="mb-2">
            <label>Username:</label>
        </div>

        <div class="mb-3">
            <input type="text" placeholder="Username" name="username" class="form-control">
        </div>

        <div class="mb-2">
            <label>Email:</label>
        </div>

        <div class="mb-3">
            <input type="email" placeholder="email" name="email" class="form-control">
        </div>

        <div class="mb-2">
            <label>Phone Number:</label>
        </div>

        <div class="mb-3">
            <input type="number" placeholder="PHone number" name="number" class="form-control">
        </div>

        <div class="mb-2">
            <label>Location:</label>
        </div>

        <div class="mb-3">
            <input type="text" placeholder="Location" name="Location" class="form-control">
        </div>

        <div>
            <input type="submit" class="btn btn-success">
        </div>

    </form>
